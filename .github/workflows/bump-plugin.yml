# Keeps the scaffold's sbt-godot-scala-native pin on the newest release that
# JitPack has built, so `sbt new` always generates a project on the latest
# version while each generated project stays pinned (reproducible). Also syncs
# the scaffold's editor addon from that release's jar when the jar's addon
# version is newer.
name: bump-plugin

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-plugin
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest JitPack release
        id: latest
        run: |
          base=https://jitpack.io/com/github/optical002/godot-scala-native/sbt-godot-scala-native_2.12_1.0
          # Highest plain-semver version JitPack lists; skips commit-hash builds.
          version=$(curl -sfL --retry 3 "$base/maven-metadata.xml" \
            | grep -oE '<version>[0-9]+\.[0-9]+\.[0-9]+</version>' \
            | sed -E 's:</?version>::g' \
            | sort -V | tail -n1)
          if [ -z "$version" ]; then
            echo "::error::no release found in JitPack metadata"
            exit 1
          fi
          # Only take a version whose plugin POM is actually served.
          curl -sfL --retry 3 -o /dev/null \
            "$base/$version/sbt-godot-scala-native_2.12_1.0-$version.pom"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update plugins.sbt
        id: bump
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          file=src/main/g8/scala/project/plugins.sbt
          sed -i -E "s/(\"sbt-godot-scala-native\" % \")[^\"]+\"/\1${VERSION}\"/" "$file"
          grep -q "\"sbt-godot-scala-native\" % \"${VERSION}\"" "$file"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update editor addon
        id: addon
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          base=https://jitpack.io/com/github/optical002/godot-scala-native/sbt-godot-scala-native_2.12_1.0
          tmp=$(mktemp -d)
          curl -sfL --retry 3 -o "$tmp/plugin.jar" \
            "$base/$VERSION/sbt-godot-scala-native_2.12_1.0-$VERSION.jar"
          unzip -q "$tmp/plugin.jar" 'godot-addon/*' -d "$tmp"

          src=$tmp/godot-addon
          dst=src/main/g8/godot/addons/godot_scala
          ver() { sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' "$1" 2>/dev/null; }
          new=$(ver "$src/plugin.cfg")
          old=$(ver "$dst/plugin.cfg")
          echo "addon: template ${old:-none}, jar ${new:-none}"

          # Only replace when the jar's addon is strictly newer.
          if [ -n "$new" ] && [ "$new" != "$old" ] && \
             [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n1)" = "$new" ]; then
            mkdir -p "$dst"
            cp "$src/plugin.cfg" "$src/icon.svg" "$src/godot.svg" "$dst/"
            sed 's|@SBT_PROJECT_DIR@|../scala|' "$src/scala_build.gd" > "$dst/scala_build.gd"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$new" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.bump.outputs.changed == 'true' || steps.addon.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          ADDON: ${{ steps.addon.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/main/g8
          msg="Bump sbt-godot-scala-native to ${VERSION}"
          if [ -n "$ADDON" ]; then msg="$msg (editor addon ${ADDON})"; fi
          git commit -m "$msg"
          git push
